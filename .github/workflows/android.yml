name: Android Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Electron Build and Release"]
    types:
      - completed

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./capacitor
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3
        with:
          fetch-tags: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install specific build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          echo "Build tools installed:"
          ls -la $ANDROID_HOME/build-tools/

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove Cached Build
        run: rm -rf ./build && mkdir ./build

      - name: Forcefully Remove Developer Mode
        run: |
          sed -i "s@if (mode === 'development')@// if (mode === 'development')@g" ./capacitor.config.js
          echo "Forcefully removed developer mode"

      - name: Build Native + Web
        run: pnpm run build:app

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Check if APK directory exists (pre-build)
        run: |
          echo "Checking Android structure before Gradle build:"
          ls -la android/ || echo "No android folder"
          ls -la android/app/ || echo "No app folder"

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build App
        run: cd android && chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Verify APK files after build
        run: |
          echo "APK files after Gradle build:"
          find . -name "*.apk" -type f
          echo "Release APK directory contents:"
          ls -la android/app/build/outputs/apk/release/ || echo "⚠️ Release APK directory not found"

      - name: Stop Gradle daemon
        run: cd android && ./gradlew --stop

      # Decode MY_GITHUB_TOKEN from base64 if needed
      - name: Decode GitHub Token
        id: decode_token
        run: |
          if echo "${{ secrets.MY_GITHUB_TOKEN }}" | base64 -d > /dev/null 2>&1; then
            DECODED_TOKEN=$(echo "${{ secrets.MY_GITHUB_TOKEN }}" | base64 -d)
            echo "DECODED_TOKEN=$DECODED_TOKEN" >> $GITHUB_ENV
            echo "✅ Token decoded from base64"
          else
            echo "DECODED_TOKEN=${{ secrets.MY_GITHUB_TOKEN }}" >> $GITHUB_ENV
            echo "ℹ️ Token used as-is (not base64)"
          fi

      - name: Get Tag
        env:
          GITHUB_TOKEN: ${{ env.DECODED_TOKEN }}
        run: |
          GIT_CURR_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "GIT_CURR_TAG=$GIT_CURR_TAG" >> $GITHUB_ENV
          echo "LAST_COMMIT_MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_ENV
          echo "Last Tag is: $GIT_CURR_TAG"

      # 🔒 CORREGIDO: Firmado manual seguro de APKs
      - name: Sign APK manually
        id: sign_apk
        run: |
          APK_RELEASE_DIR="./android/app/build/outputs/apk/release"

          if [ ! -d "$APK_RELEASE_DIR" ]; then
            echo "❌ ERROR: APK release directory not found!"
            echo "Expected: $APK_RELEASE_DIR"
            ls -la ./android/app/build/outputs/apk/ 2>/dev/null || echo "No APK outputs at all"
            exit 1
          fi

          echo "📁 Entering APK release directory..."
          cd "$APK_RELEASE_DIR"

          echo "📦 APKs found before signing:"
          ls -la *.apk 2>/dev/null || echo "No APK files found"

          # Rebuild keystore from base64 secret
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > signing.jks

          BUILD_TOOLS_PATH="/usr/local/lib/android/sdk/build-tools/34.0.0"
          if [ ! -d "$BUILD_TOOLS_PATH" ]; then
            echo "❌ Build-tools 34.0.0 not found at expected path"
            ls -la /usr/local/lib/android/sdk/build-tools/
            exit 1
          fi

          found_unsigned=false

          # Sign flavor-specific unsigned APKs (e.g., app-arm64-v8a-release-unsigned.apk)
          for apk in *-release-unsigned.apk; do
            if [ -f "$apk" ]; then
              found_unsigned=true
              aligned_apk="${apk/-unsigned/-aligned}"
              signed_apk="${apk/-unsigned/-signed}"
              echo "➡️ Processing: $apk"
              $BUILD_TOOLS_PATH/zipalign -v -p 4 "$apk" "$aligned_apk"
              $BUILD_TOOLS_PATH/apksigner sign \
                --ks signing.jks \
                --ks-key-alias "${{ secrets.ALIAS }}" \
                --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
                --out "$signed_apk" \
                "$aligned_apk"
              echo "✅ Signed: $signed_apk"
            fi
          done

          # Sign universal APK if exists
          if [ -f "app-release-unsigned.apk" ]; then
            found_unsigned=true
            aligned_apk="app-release-aligned.apk"
            signed_apk="app-release-signed.apk"
            echo "➡️ Processing universal APK: app-release-unsigned.apk"
            $BUILD_TOOLS_PATH/zipalign -v -p 4 "app-release-unsigned.apk" "$aligned_apk"
            $BUILD_TOOLS_PATH/apksigner sign \
              --ks signing.jks \
              --ks-key-alias "${{ secrets.ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed_apk" \
              "$aligned_apk"
            echo "✅ Signed universal APK: $signed_apk"
          fi

          if [ "$found_unsigned" = false ]; then
            echo "⚠️ No unsigned APKs found. Possible causes:"
            echo "   - Gradle already signed the APK (check build.gradle for signingConfig)"
            echo "   - Build did not produce release APKs"
            echo "Available APKs:"
            ls -la *.apk
          fi

          rm -f signing.jks
          echo "✅ Final signed APKs:"
          ls -la *-signed.apk 2>/dev/null || echo "No signed APKs generated"

      - name: List all APK files after signing
        run: |
          echo "All APK files in release directory after signing:"
          find android/app/build/outputs/apk/release -name "*.apk" -type f | while read file; do
            echo " - $file ($(du -h "$file" | cut -f1))"
          done

      - name: Generate latest-android.yml
        run: |
          echo "version: ${GIT_CURR_TAG#v}" > latest-android.yml
          echo "files:" >> latest-android.yml
          find android/app/build/outputs/apk/release -name "*signed.apk" -type f | while read file; do
            filename=$(basename "$file")
            # Cross-platform file size
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file")
            sha512=$(shasum -a 512 "$file" | cut -d' ' -f1)
            echo "  - url: $filename" >> latest-android.yml
            echo "    sha512: $sha512" >> latest-android.yml
            echo "    size: $size" >> latest-android.yml
          done

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ env.GIT_CURR_TAG }}
          path: |
            capacitor/android/app/build/outputs/apk/release/*signed.apk
            capacitor/latest-android.yml
          retention-days: 30
          compression-level: 9

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        if: env.GIT_CURR_TAG != ''
        env:
          GITHUB_TOKEN: ${{ env.DECODED_TOKEN }}
        with:
          tag_name: ${{ env.GIT_CURR_TAG }}
          name: Release ${{ env.GIT_CURR_TAG }}
          body: |
            Android Build - ${{ env.GIT_CURR_TAG }}
            
            Last commit: ${{ env.LAST_COMMIT_MESSAGE }}
            
            **Built files:**
            - Signed APK files
            - Update metadata
            
            Auto-generated from GitHub Actions
          files: |
            capacitor/android/app/build/outputs/apk/release/*signed.apk
            capacitor/latest-android.yml
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo "📱 APK files uploaded to:"
          echo "   - Artifacts: android-apks-${{ env.GIT_CURR_TAG }}"
          echo "   - Release: ${{ env.GIT_CURR_TAG }}"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ env.GIT_CURR_TAG }}"
