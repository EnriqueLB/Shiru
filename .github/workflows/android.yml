name: Android Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Electron Build and Release"]
    types:
      - completed

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./capacitor
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3
        with:
          fetch-tags: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install specific build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          echo "Build tools installed:"
          ls -la $ANDROID_HOME/build-tools/

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove Cached Build
        run: rm -rf ./build && mkdir ./build

      - name: Forcefully Remove Developer Mode
        run: |
          sed -i "s@if (mode === 'development')@// if (mode === 'development')@g" ./capacitor.config.js
          echo "Forcefully removed developer mode"

      - name: Build Native + Web
        run: pnpm run build:app

      - name: Sync 
        run: pnpm exec cap sync android

      - name: Check available build-tools
        run: |
          echo "Available build-tools:"
          ls -la /usr/local/lib/android/sdk/build-tools/

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build App
        run: cd android && chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Stop Gradle daemon
        run: cd android && ./gradlew --stop

      # Decodificar MY_GITHUB_TOKEN desde base64
      - name: Decode GitHub Token
        id: decode_token
        run: |
          if echo "${{ secrets.MY_GITHUB_TOKEN }}" | base64 -d > /dev/null 2>&1; then
            DECODED_TOKEN=$(echo "${{ secrets.MY_GITHUB_TOKEN }}" | base64 -d)
            echo "DECODED_TOKEN=$DECODED_TOKEN" >> $GITHUB_ENV
            echo "✅ Token decodificado correctamente desde base64"
          else
            echo "DECODED_TOKEN=${{ secrets.MY_GITHUB_TOKEN }}" >> $GITHUB_ENV
            echo "ℹ️ Token no estaba en base64, usando directamente"
          fi

      - name: Get Tag
        env:
          GITHUB_TOKEN: ${{ env.DECODED_TOKEN }}
        run: | 
          GIT_CURR_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "GIT_CURR_TAG=$GIT_CURR_TAG" >> $GITHUB_ENV
          echo "LAST_COMMIT_MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_ENV
          echo "Last Tag is: $GIT_CURR_TAG"

      # Sign APK especificando la versión de build-tools
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: capacitor/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: "34.0.0"  # Especificar versión disponible

      - name: List signed files
        run: |
          echo "Signed APK files:"
          find capacitor/android/app/build/outputs/apk/release -name "*.apk" -type f | while read file; do
            echo " - $file ($(du -h "$file" | cut -f1))"
          done

      - name: Generate latest-android.yml
        run: |
          echo "version: ${GIT_CURR_TAG#v}" > latest-android.yml
          echo "files:" >> latest-android.yml
          find capacitor/android/app/build/outputs/apk/release -name "*signed*.apk" -type f | while read file; do
            filename=$(basename "$file")
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)
            echo "  - url: $filename" >> latest-android.yml
            echo "    sha512: $(shasum -a 512 "$file" | cut -d' ' -f1)" >> latest-android.yml
            echo "    size: $size" >> latest-android.yml
          done

      # SUBIR A ARTIFACTS
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ env.GIT_CURR_TAG }}
          path: |
            capacitor/android/app/build/outputs/apk/release/*signed*.apk
            latest-android.yml
          retention-days: 30
          compression-level: 9

      # SUBIR A RELEASES
      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        if: env.GIT_CURR_TAG != ''
        env:
          GITHUB_TOKEN: ${{ env.DECODED_TOKEN }}
        with:
          tag_name: ${{ env.GIT_CURR_TAG }}
          name: Release ${{ env.GIT_CURR_TAG }}
          body: |
            Android Build - ${{ env.GIT_CURR_TAG }}
            
            Last commit: ${{ env.LAST_COMMIT_MESSAGE }}
            
            **Built files:**
            - Signed APK files
            - Update metadata
            
            Auto-generated from GitHub Actions
          files: |
            capacitor/android/app/build/outputs/apk/release/*signed*.apk
            latest-android.yml
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo "📱 APK files uploaded to:"
          echo "   - Artifacts: android-apks-${{ env.GIT_CURR_TAG }}"
          echo "   - Release: ${{ env.GIT_CURR_TAG }}"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ env.GIT_CURR_TAG }}"
