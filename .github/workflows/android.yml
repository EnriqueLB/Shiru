name: Android Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Electron Build and Release"]
    types:
      - completed

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./capacitor
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3
        with:
          fetch-tags: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install specific build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          echo "Build tools installed:"
          ls -la $ANDROID_HOME/build-tools/

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove Cached Build
        run: rm -rf ./build && mkdir ./build

      - name: Forcefully Remove Developer Mode
        run: |
          sed -i "s@if (mode === 'development')@// if (mode === 'development')@g" ./capacitor.config.js
          echo "Forcefully removed developer mode"

      - name: Build Native + Web
        run: pnpm run build:app

      - name: Sync 
        run: pnpm exec cap sync android

      - name: Check if APK directory exists
        run: |
          echo "Checking APK directory structure:"
          find . -name "*.apk" -type f | head -10
          echo "Android build outputs:"
          ls -la android/app/build/outputs/ || echo "No android directory found"
          ls -la android/app/build/outputs/apk/ || echo "No apk directory found"
          ls -la android/app/build/outputs/apk/release/ || echo "No release directory found"

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build App
        run: cd android && chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Verify APK files after build
        run: |
          echo "APK files after build:"
          find . -name "*.apk" -type f
          echo "Release APK files:"
          ls -la android/app/build/outputs/apk/release/ || echo "No release APKs found"

      - name: Stop Gradle daemon
        run: cd android && ./gradlew --stop

      # Decodificar MY_GITHUB_TOKEN desde base64
      - name: Decode GitHub Token
        id: decode_token
        run: |
          if echo "${{ secrets.MY_GITHUB_TOKEN }}" | base64 -d > /dev/null 2>&1; then
            DECODED_TOKEN=$(echo "${{ secrets.MY_GITHUB_TOKEN }}" | base64 -d)
            echo "DECODED_TOKEN=$DECODED_TOKEN" >> $GITHUB_ENV
            echo "✅ Token decodificado correctamente desde base64"
          else
            echo "DECODED_TOKEN=${{ secrets.MY_GITHUB_TOKEN }}" >> $GITHUB_ENV
            echo "ℹ️ Token no estaba en base64, usando directamente"
          fi

      - name: Get Tag
        env:
          GITHUB_TOKEN: ${{ env.DECODED_TOKEN }}
        run: | 
          GIT_CURR_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "GIT_CURR_TAG=$GIT_CURR_TAG" >> $GITHUB_ENV
          echo "LAST_COMMIT_MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_ENV
          echo "Last Tag is: $GIT_CURR_TAG"

      # SOLUCIÓN CORREGIDA: Sign APK manualmente con rutas correctas
      - name: Sign APK manually
  id: sign_apk
  run: |
    APK_RELEASE_DIR="./android/app/build/outputs/apk/release"
    
    # Verificar que el directorio existe
    if [ ! -d "$APK_RELEASE_DIR" ]; then
      echo "❌ Error: $APK_RELEASE_DIR does not exist. Did the build succeed?"
      ls -la ./android/app/build/outputs/apk/ || echo "No APK outputs found"
      exit 1
    fi

    echo "📁 APK release directory exists. Contents:"
    ls -la "$APK_RELEASE_DIR"

    # Ir al directorio
    cd "$APK_RELEASE_DIR"

    # Reconstruir keystore
    echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > signing.jks

    BUILD_TOOLS_PATH="/usr/local/lib/android/sdk/build-tools/34.0.0"
    echo "Using build-tools from: $BUILD_TOOLS_PATH"

    # Firmar APKs no firmados
    found_unsigned=false
    for apk in *-release-unsigned.apk; do
      if [ -f "$apk" ]; then
        found_unsigned=true
        echo "Processing: $apk"
        aligned_apk="${apk/-unsigned/-aligned}"
        signed_apk="${apk/-unsigned/-signed}"

        $BUILD_TOOLS_PATH/zipalign -v -p 4 "$apk" "$aligned_apk"
        $BUILD_TOOLS_PATH/apksigner sign \
          --ks signing.jks \
          --ks-key-alias "${{ secrets.ALIAS }}" \
          --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
          --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
          --out "$signed_apk" \
          "$aligned_apk"
        echo "✅ Signed: $signed_apk"
      fi
    done

    # También intentar con app-release-unsigned.apk (universal)
    if [ -f "app-release-unsigned.apk" ]; then
      found_unsigned=true
      aligned_apk="app-release-aligned.apk"
      signed_apk="app-release-signed.apk"
      $BUILD_TOOLS_PATH/zipalign -v -p 4 "app-release-unsigned.apk" "$aligned_apk"
      $BUILD_TOOLS_PATH/apksigner sign \
        --ks signing.jks \
        --ks-key-alias "${{ secrets.ALIAS }}" \
        --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
        --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
        --out "$signed_apk" \
        "$aligned_apk"
      echo "✅ Signed universal APK: $signed_apk"
    fi

    if [ "$found_unsigned" = false ]; then
      echo "⚠️ No unsigned APKs found. Maybe Gradle already signed them?"
      echo "Available APKs:"
      ls -la *.apk
    fi

    rm -f signing.jks
    echo "Signed APKs:"
    ls -la *-signed.apk 2>/dev/null || echo "None found"

      - name: List all APK files after signing
        run: |
          echo "All APK files in release directory after signing:"
          find android/app/build/outputs/apk/release -name "*.apk" -type f | while read file; do
            echo " - $file ($(du -h "$file" | cut -f1))"
          done

      - name: Generate latest-android.yml
        run: |
          echo "version: ${GIT_CURR_TAG#v}" > latest-android.yml
          echo "files:" >> latest-android.yml
          find android/app/build/outputs/apk/release -name "*signed.apk" -type f | while read file; do
            filename=$(basename "$file")
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)
            sha512=$(shasum -a 512 "$file" | cut -d' ' -f1)
            echo "  - url: $filename" >> latest-android.yml
            echo "    sha512: $sha512" >> latest-android.yml
            echo "    size: $size" >> latest-android.yml
          done

      # SUBIR A ARTIFACTS
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ env.GIT_CURR_TAG }}
          path: |
            capacitor/android/app/build/outputs/apk/release/*signed.apk
            capacitor/latest-android.yml
          retention-days: 30
          compression-level: 9

      # SUBIR A RELEASES
      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        if: env.GIT_CURR_TAG != ''
        env:
          GITHUB_TOKEN: ${{ env.DECODED_TOKEN }}
        with:
          tag_name: ${{ env.GIT_CURR_TAG }}
          name: Release ${{ env.GIT_CURR_TAG }}
          body: |
            Android Build - ${{ env.GIT_CURR_TAG }}
            
            Last commit: ${{ env.LAST_COMMIT_MESSAGE }}
            
            **Built files:**
            - Signed APK files
            - Update metadata
            
            Auto-generated from GitHub Actions
          files: |
            capacitor/android/app/build/outputs/apk/release/*signed.apk
            capacitor/latest-android.yml
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo "📱 APK files uploaded to:"
          echo "   - Artifacts: android-apks-${{ env.GIT_CURR_TAG }}"
          echo "   - Release: ${{ env.GIT_CURR_TAG }}"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ env.GIT_CURR_TAG }}"
